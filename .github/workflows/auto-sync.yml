name: Auto Sync Fork

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）自动同步一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 Actions 页面随时手动点一下立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动识别当前仓库的上游（parent）并同步默认分支
          gh repo sync "${{ github.repository }}"
